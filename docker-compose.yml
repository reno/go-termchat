services:
  termchat:
    build: .
    image: termchat:local
    ports:
      - "8080:8080"
    environment:
      TERMCHAT_ADDR: ":8080"
      TERMCHAT_ENV: development
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/termchat", "-healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 3s
