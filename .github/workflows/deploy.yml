name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-backend:
    name: Deploy Backend to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          missing=()
          [ -n "$ORACLE_HOST" ] || missing+=(ORACLE_HOST)
          [ -n "$ORACLE_SSH_KEY" ] || missing+=(ORACLE_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi
          case "$ORACLE_SSH_KEY" in
            *"PRIVATE KEY"*) ;;
            *)
              echo "::error::ORACLE_SSH_KEY is not an OpenSSH private key (a public .pub key or PuTTY .ppk will not work)"
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          if [ -n "$ORACLE_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::ORACLE_SSH_KNOWN_HOSTS is not set; trusting the host key on first use"
            ssh-keyscan -T 15 "$ORACLE_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/oracle || echo "::warning::could not read a fingerprint from ORACLE_SSH_KEY"

      - name: Verify SSH access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
        run: |
          if ssh -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" true; then
            exit 0
          fi
          echo "::error::SSH authentication failed. Check that ORACLE_SSH_USER matches the image (ubuntu for Ubuntu, opc for Oracle Linux) and that the matching public key is in that user's ~/.ssh/authorized_keys. Verbose handshake follows."
          ssh -vv -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" true 2>&1 | sed -n '1,80p' || true
          exit 1

      - name: Verify instance is provisioned
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" bash -s <<'ENDSSH'
          export PATH="/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"
          status=0

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker is not installed, or not on PATH for this user"
            status=1
          elif ! docker info >/dev/null 2>&1; then
            echo "::error::docker is installed but this user cannot talk to the daemon (missing docker group, or the group was added without a new login)"
            status=1
          fi

          if [ ! -f "$HOME/termchat/docker-compose.yml" ]; then
            echo "::error::$HOME/termchat/docker-compose.yml is missing; the instance setup script has not completed"
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "instance: $(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || echo unknown)"
            echo "PATH: $PATH"
          fi
          exit "$status"
          ENDSSH

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to instance
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" \
            "PATH=/usr/local/bin:/usr/bin:/bin:/snap/bin:\$PATH docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          ssh -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"

          cd ~/termchat

          if command -v docker-compose >/dev/null 2>&1; then
            compose() { docker-compose "$@"; }
          else
            compose() { docker compose "$@"; }
          fi

          sed -i "s|^\( *image: \).*|\1$IMAGE|" docker-compose.yml

          compose pull

          if systemctl is-enabled termchat.service >/dev/null 2>&1; then
            sudo systemctl restart termchat
          else
            compose up -d --remove-orphans
          fi

          docker logout ghcr.io
          docker image prune -f
          ENDSSH

      - name: Health check
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$ORACLE_SSH_USER@$ORACLE_HOST" bash -s <<'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          cd ~/termchat
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose logs --tail=50
          else
            docker compose logs --tail=50
          fi
          exit 1
          ENDSSH

      - name: Revoke SSH key
        if: always()
        run: rm -f ~/.ssh/oracle

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend (Oracle Cloud): ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed at $(date)" >> $GITHUB_STEP_SUMMARY
